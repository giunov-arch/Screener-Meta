name: Fetch Dati Borsa Italiana

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * 1-5'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install yfinance==0.2.40 pandas==2.2.3 numpy==1.26.4 requests curl-cffi==0.7.1
          # yfinance 0.2.40 + curl_cffi 0.7.1 funziona, 0.2.54 no (bug 'str has no attribute name')

      - name: Run collector (quello che funzionava)
        run: |
          set -x
          if [ -f collector.py ]; then
            echo "Uso collector.py in root"
            python collector.py
          elif [ -f github-screener-italia/collector.py ]; then
            python github-screener-italia/collector.py
          else
            python fetcher.py
          fi
          ls -lh dati/ data/ 2>/dev/null || true

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dati/snapshot.json data/snapshot.json data/italian_stocks.json data/italian_stocks.csv data/last_update.json 2>/dev/null || true
          git add -f dati/ data/ 2>/dev/null || true
          git status
          if git diff --staged --quiet; then
            echo "Nessun cambiamento"
            exit 0
          fi
          git commit -m "Aggiornamento dati: $(date -u +'%Y-%m-%d %H:%M UTC') - collector fix"
          git push
