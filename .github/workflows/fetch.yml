name: Fetch Dati Borsa Italiana

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * 1-5'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install yfinance==0.2.40 pandas==2.2.3 numpy==1.26.4 requests curl-cffi==0.7.1

      - name: Run collector finale (bypass diretto Yahoo chart API)
        run: |
          python collector.py
          ls -lh dati/ data/ 2>/dev/null || true

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dati/snapshot.json data/snapshot.json data/italian_stocks.json data/italian_stocks.csv data/last_update.json
          git add -f dati/ data/
          git status
          if git diff --staged --quiet; then
            echo "Nessun cambiamento"
            exit 0
          fi
          git commit -m "Aggiornamento dati: $(date -u +'%Y-%m-%d %H:%M UTC') - collector direct chart API"
          git push
