name: Fetch Dati Borsa Italiana

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * 1-5'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run collector
        run: |
          python collector.py || python fetcher_v4_collector_based.py || python fetcher.py --no-fundamentals
          echo "--- files ---"
          ls -lh dati/ data/ 2>/dev/null || true
          ls -lh *.json 2>/dev/null || true
      - name: Commit e push con rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dati/snapshot.json data/italian_stocks.json data/italian_stocks.csv universo.json -f 2>/dev/null || git add dati/ data/ -f
          if git diff --staged --quiet; then
            echo "Nessun cambiamento"
            exit 0
          fi
          git commit -m "Aggiornamento dati: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Fix per l'errore "fetch first" - pull con rebase prima di push
          git pull --rebase origin main || git pull --rebase
          git push || (git push --force-with-lease)