<script>
// Fix: usa /data come primario (più stabile) ma prova anche /dati per compatibilità
// Ora fetch.yml duplica dati/snapshot.json -> data/snapshot.json così /data contiene sempre il file grande
const WORKER_URL = "https://rapid-paper-5635.giunov.workers.dev";
const SNAPSHOT_URLS = [
  "./data/snapshot.json",
  "./dati/snapshot.json",
  "./data/italian_stocks.json",
  "/Screener-Meta/data/snapshot.json",
  "/Screener-Meta/dati/snapshot.json",
  "/Screener-Meta/data/italian_stocks.json",
  "https://giunov-arch.github.io/Screener-Meta/data/snapshot.json",
  "https://giunov-arch.github.io/Screener-Meta/dati/snapshot.json",
  "https://giunov-arch.github.io/Screener-Meta/data/italian_stocks.json",
  "https://cdn.jsdelivr.net/gh/giunov-arch/Screener-Meta@main/data/snapshot.json",
  "https://cdn.jsdelivr.net/gh/giunov-arch/Screener-Meta@main/dati/snapshot.json",
  "https://cdn.jsdelivr.net/gh/giunov-arch/Screener-Meta@main/data/italian_stocks.json"
];

let snapshot = null;
let selected = null;
let titoliFiltrati = [];

function log(msg){
  const box = document.getElementById('logBox');
  const div = document.createElement('div');
  div.textContent = new Date().toLocaleTimeString() + " " + msg;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  document.getElementById('log').textContent = msg;
  console.log(msg);
}

function calcScoreF(f){
  let s=50;
  if(f.pe && f.pe>0){ if(f.pe<12) s+=12; else if(f.pe<18) s+=6; else if(f.pe>25) s-=10; }
  if(f.pb && f.pb>0){ if(f.pb<1.2) s+=8; else if(f.pb>3) s-=6; }
  if(f.roe && f.roe>15) s+=15; else if(f.roe && f.roe<5) s-=10;
  if(f.divYield && f.divYield>4) s+=8;
  if(f.debtEquity && f.debtEquity<0.5) s+=6; else if(f.debtEquity && f.debtEquity>1.2) s-=8;
  if(f.cet1 && f.cet1>14) s+=5;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function calcSMA(values, period){
  const res=[]; let sum=0;
  for(let i=0;i<values.length;i++){ sum+=values[i]; if(i>=period) sum-=values[i-period]; res.push(i>=period-1?sum/period:null); }
  return res;
}
function calcScoreT(history){
  if(!history || history.length<50) return 50;
  const closes=history.map(h=>h.close);
  const sma50=calcSMA(closes,50);
  const sma200=calcSMA(closes,200);
  const last=closes.length-1;
  let s=50;
  if(sma50[last] && sma200[last] && closes[last]>sma50[last] && sma50[last]>sma200[last]) s+=15;
  if(closes[last] && sma50[last] && Math.abs(closes[last]-sma50[last])/sma50[last]<0.02) s+=5;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function normalizeConsenso(con, prezzo, scoreTot){
  const fallbackRating = scoreTot>=70?"Buy":scoreTot>=50?"Hold":"Sell";
  const fallback = {
    rating: fallbackRating,
    targetPrice: +(prezzo*1.18).toFixed(2),
    upside: 18,
    buy: fallbackRating==="Buy"?10:3,
    hold:5,
    sell: fallbackRating==="Sell"?4:1,
    numAnalysts:8,
    tp: +(prezzo*1.18).toFixed(2)
  };
  if(!con) return fallback;
  // collector.py format: {tp, lo, hi, n, b, h, s}
  if(con.tp || con.targetPrice || con.tp===0){
    return {
      rating: con.rating || fallback.rating,
      targetPrice: con.tp || con.targetPrice || fallback.targetPrice,
      tp: con.tp || con.targetPrice || fallback.tp,
      lo: con.lo || 0,
      hi: con.hi || 0,
      buy: con.b ?? con.buy ?? fallback.buy,
      hold: con.h ?? con.hold ?? fallback.hold,
      sell: con.s ?? con.sell ?? fallback.sell,
      numAnalysts: con.n ?? con.numAnalysts ?? fallback.numAnalysts,
      upside: con.upside ?? 15
    };
  }
  return {
    rating: con.rating || fallback.rating,
    targetPrice: con.targetPrice || con.tp || fallback.targetPrice,
    tp: con.targetPrice || con.tp || fallback.tp,
    buy: con.buy ?? con.b ?? fallback.buy,
    hold: con.hold ?? con.h ?? fallback.hold,
    sell: con.sell ?? con.s ?? fallback.sell,
    numAnalysts: con.numAnalysts ?? con.n ?? fallback.numAnalysts,
    upside: con.upside ?? 15,
    lo: con.lo||0, hi: con.hi||0
  };
}

function generaDemoFallback(){
  log("⚠ Uso DEMO locale - snapshot non trovato su GitHub");
  const base = [
    {ticker:"ENI.MI",nome:"Eni SpA",settore:"Energy",price:14.82},
    {ticker:"ENEL.MI",nome:"Enel",settore:"Utilities",price:6.95},
    {ticker:"ISP.MI",nome:"Intesa Sanpaolo",settore:"Banche",price:3.42},
    {ticker:"UCG.MI",nome:"UniCredit",settore:"Banche",price:38.1},
    {ticker:"G.MI",nome:"Generali",settore:"Assicurazioni",price:22.4},
  ];
  const titoli = base.map(b=>{
    const history=[];
    let p=b.price;
    for(let i=300;i>=0;i--){
      const d=new Date(); d.setDate(d.getDate()-i);
      if(d.getDay()===0||d.getDay()===6) continue;
      const ch=(Math.random()-0.48)*0.015;
      const close=p*(1+ch);
      history.push({date:d.toISOString().slice(0,10),open:p,high:Math.max(p,close)*1.005,low:Math.min(p,close)*0.995,close,volume:1000000});
      p=close;
    }
    const f={pe:12,pb:1.1,roe:14,divYield:5,debtEquity:0.4,cet1:15,mcap:10};
    const scoreF=calcScoreF(f);
    const scoreT=calcScoreT(history);
    return {ticker:b.ticker,nome:b.nome,settore:b.settore,prezzo:history[history.length-1].close,pe:12,pb:1.1,roe:14,divYield:5,debtEquity:0.4,cet1:15,marketCap:10,scoreF,scoreT,scoreTot:Math.round((scoreF+scoreT)/2),consenso:normalizeConsenso(null,history[history.length-1].close,60),history,f};
  });
  return {generatedAt:new Date().toISOString(),titoli, isDemo:true};
}

function parseSnapshot(j){
  // Supporta sia formato collector.py {titoli:[{ticker,nome,settore,barre,f,con}]} sia vecchio {titoli:[{ticker,prezzo,barre}]} sia flat data/italian_stocks.json [{Ticker,Prezzo,...}]
  let titoliRaw = j.titoli || j || [];
  // Se è flat (array di Ticker/Prezzo)
  if(Array.isArray(titoliRaw) && titoliRaw.length && titoliRaw[0].Ticker){
    titoliRaw = titoliRaw.map(f=>({
      ticker: f.TickerYahoo || f.Ticker + ".MI",
      nome: f.Nome || f.Ticker,
      settore: f.Settore || "Industrials",
      barre: [],
      f: {mcap:f.MarketCapMld, pe:f.PE, pb:f.PB, roe:f.ROE, divYield:f.DivYield, debtEquity:f.DebtEquity},
      con: f.Consenso,
      prezzo: f.Prezzo
    }));
  }
  const titoli = titoliRaw.map(t=>{
    // collector.py barre: {d,o,h,l,c,v}
    let history = [];
    if(t.barre && t.barre.length){
      history = t.barre.map(b=>({
        date: b.d || b.date,
        open: b.o ?? b.open,
        high: b.h ?? b.high,
        low: b.l ?? b.low,
        close: b.c ?? b.close,
        volume: b.v ?? b.volume || 0
      }));
    } else if(t.history){
      history = t.history;
    } else if(t.prezzo){
      history = [{date:new Date().toISOString().slice(0,10), open:t.prezzo, high:t.prezzo, low:t.prezzo, close:t.prezzo, volume:0}];
    }
    const f = t.f || { pe: t.PE || t.pe, pb: t.PB || t.pb, roe: t.ROE || t.roe, divYield: t.DivYield || t.divYield, debtEquity: t.DebtEquity, cet1: t.cet1, mcap: t.MarketCapMld };
    const prezzo = history.length ? history[history.length-1].close : (t.prezzo || t.Prezzo || t.f?.mcap || 0);
    const scoreF = t.ScoreF ?? t.scoreF ?? calcScoreF(f);
    const scoreT = t.ScoreT ?? t.scoreT ?? calcScoreT(history);
    const scoreTot = t.ScoreTot ?? t.scoreTot ?? Math.round((scoreF+scoreT)/2);
    const consenso = normalizeConsenso(t.con || t.consenso || t.Consenso, prezzo, scoreTot);
    return {
      ticker: t.ticker || t.Ticker,
      nome: t.nome || t.Nome || t.ticker,
      settore: t.settore || t.Settore || "Altro",
      prezzo,
      pe: f.pe || 0,
      pb: f.pb || 0,
      roe: f.roe || 0,
      divYield: f.divYield || f.divYield || 0,
      debtEquity: f.debtEquity || 0,
      cet1: f.cet1 || 0,
      marketCap: f.mcap || 0,
      scoreF, scoreT, scoreTot,
      consenso,
      history,
      f
    };
  });
  return { generatedAt: j.generato_il || j.generatedAt || new Date().toISOString(), titoli, isDemo: !!j.isDemo };
}

async function fetchSnapshot(){
  log("→ Avvio fetch snapshot collector.py...");
  for(let url of SNAPSHOT_URLS){
    try{
      log("→ Tento " + url);
      const bust = url + (url.includes("?")?"&":"?") + "v=" + Date.now();
      const r = await fetch(bust, {cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const text = await r.text();
      // Controlla se è HTML (404 page)
      if(text.trim().startsWith("<") || text.includes("<!DOCTYPE")) throw new Error("Ricevuto HTML invece di JSON (404)");
      const j = JSON.parse(text);
      const snap = parseSnapshot(j);
      if(!snap.titoli.length) throw new Error("vuoto (0 titoli)");
      snapshot = snap;
      document.getElementById('lastUpdate').textContent = new Date(snap.generatedAt).toLocaleString('it-IT') + (snap.isDemo ? " [DEMO]" : "");
      document.getElementById('countInfo').textContent = snap.titoli.length + " titoli" + (snap.isDemo ? " (demo)" : "");
      document.getElementById('statusBadge').textContent = snap.isDemo ? "Demo" : "Aggiornato";
      document.getElementById('statusBadge').className = snap.isDemo ? "text-[11px] bg-amber-50 text-amber-700 border rounded-full px-3 py-1" : "text-[11px] bg-emerald-50 text-emerald-700 border rounded-full px-3 py-1";
      log("✓ Trovato: " + new Date(snap.generatedAt).toLocaleString() + " (" + snap.titoli.length + " titoli) da " + url);
      render();
      return snap;
    }catch(e){
      log("✗ " + url + " → " + e.message);
    }
  }
  // Fallback finale demo per non lasciare pagina bianca
  log("⚠ Nessuno snapshot disponibile, carico DEMO");
  const demo = generaDemoFallback();
  snapshot = demo;
  document.getElementById('lastUpdate').textContent = "DEMO " + new Date().toLocaleString('it-IT');
  document.getElementById('countInfo').textContent = demo.titoli.length + " titoli DEMO";
  document.getElementById('statusBadge').textContent = "Demo - premi Aggiorna";
  document.getElementById('statusBadge').className = "text-[11px] bg-amber-50 text-amber-700 border rounded-full px-3 py-1";
  render();
  return demo;
}

function render(){
  const testo = document.getElementById('filtroTesto').value.toLowerCase();
  const settore = document.getElementById('filtroSettore').value;
  titoliFiltrati = snapshot.titoli.filter(t=>{
    if(testo && !(t.ticker+" "+t.nome).toLowerCase().includes(testo)) return false;
    if(settore!=="Tutti" && t.settore!==settore) return false;
    return true;
  });
  document.getElementById('filtratiInfo').textContent = titoliFiltrati.length + " filtrati";
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = titoliFiltrati.map(t=>{
    const isSel = selected && selected.ticker===t.ticker;
    return `<tr data-ticker="${t.ticker}" class="border-b hover:bg-slate-50 cursor-pointer ${isSel?'bg-slate-900 text-white':''}">
      <td class="px-3 py-1.5 font-semibold mono">${t.ticker}</td>
      <td class="px-3 py-1.5 truncate max-w-[160px]">${t.nome}</td>
      <td class="px-3 py-1.5">${t.settore}</td>
      <td class="px-3 py-1.5 mono">${t.prezzo.toFixed(2)}</td>
      <td class="px-3 py-1.5"><span class="px-1.5 py-0.5 rounded text-[10px] font-medium ${isSel?'bg-white text-slate-900':t.scoreF>70?'bg-emerald-100 text-emerald-700':'bg-slate-100'}">${t.scoreF}</span></td>
      <td class="px-3 py-1.5"><span class="px-1.5 py-0.5 rounded text-[10px] font-medium ${isSel?'bg-white text-slate-900':t.scoreT>70?'bg-emerald-100 text-emerald-700':'bg-slate-100'}">${t.scoreT}</span></td>
      <td class="px-3 py-1.5 font-bold mono">${t.scoreTot}</td>
    </tr>`;
  }).join('');
  tbody.querySelectorAll('tr').forEach(tr=>{
    tr.addEventListener('click',()=>{
      const ticker = tr.getAttribute('data-ticker');
      selected = snapshot.titoli.find(x=>x.ticker===ticker);
      render();
      renderDettaglio();
    });
  });
  if(!selected && titoliFiltrati.length) { selected = titoliFiltrati[0]; renderDettaglio(); }
  // popola settori
  const sel = document.getElementById('filtroSettore');
  if(sel.options.length<=1){
    const settori = ["Tutti", ...Array.from(new Set(snapshot.titoli.map(t=>t.settore)))];
    sel.innerHTML = settori.map(s=>`<option>${s}</option>`).join('');
  }
}

function renderDettaglio(){
  const box = document.getElementById('dettaglio');
  if(!selected){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const c = selected.consenso;
  const isBuy = c.rating==="Buy";
  const isSell = c.rating==="Sell";
  box.innerHTML = `
    <div class="grid grid-cols-12 gap-3">
      <div class="col-span-12 lg:col-span-8 bg-white border rounded-xl p-4">
        <h3 class="text-xs font-semibold mb-3">${selected.ticker} — ${selected.nome} • Fondamentali</h3>
        <div class="grid grid-cols-3 md:grid-cols-4 gap-2 text-[11px]">
          ${[
            ["Prezzo", selected.prezzo.toFixed(2)],
            ["PE", selected.pe],
            ["PB", selected.pb],
            ["ROE %", selected.roe],
            ["Div %", selected.divYield],
            ["Debt/Eq", selected.debtEquity],
            ["CET1 %", selected.cet1],
            ["MktCap Mld", selected.marketCap],
            ["ScoreF", selected.scoreF],
            ["ScoreT", selected.scoreT],
            ["ScoreTot", selected.scoreTot],
          ].map(([k,v])=>`<div class="bg-slate-50 rounded-lg px-2.5 py-2"><div class="text-[10px] text-slate-500 uppercase">${k}</div><div class="font-semibold mono">${v ?? "—"}</div></div>`).join('')}
        </div>
        <div class="mt-4">
          <canvas id="chart" width="800" height="360" style="width:100%;height:360px;border:1px solid #e2e8f0;border-radius:8px"></canvas>
        </div>
      </div>
      <div class="col-span-12 lg:col-span-4 space-y-3">
        <div class="bg-white border rounded-xl p-3">
          <div class="flex justify-between items-center mb-2">
            <span class="text-[11px] font-semibold">Consenso</span>
            <span class="text-[9px] px-1.5 py-0.5 rounded-full bg-slate-100">${c.numAnalysts||8} analisti</span>
          </div>
          <div class="text-[11px] space-y-1.5">
            <div class="flex justify-between items-center"><span>Rating</span><b class="px-2 py-0.5 rounded-full text-[10px] ${isBuy?'bg-emerald-500 text-white':isSell?'bg-red-500 text-white':'bg-amber-400 text-slate-900'}">${c.rating||"Hold"}</b></div>
            <div class="flex justify-between"><span>Target (TP)</span><span class="mono font-medium">${(c.targetPrice||c.tp||0).toFixed(2)} €</span></div>
            <div class="flex justify-between"><span>Low / High</span><span class="mono">${(c.lo||0).toFixed(2)} / ${(c.hi||0).toFixed(2)}</span></div>
            <div class="flex justify-between"><span>Upside</span><span class="${(c.upside||0)>=0?'text-emerald-600':'text-red-600'} font-medium">${c.upside||0}%</span></div>
            <div class="flex justify-between"><span>Buy/Hold/Sell</span><span class="mono">${c.buy||0}/${c.hold||0}/${c.sell||0}</span></div>
          </div>
          <div class="text-[9px] text-slate-400 mt-2">Fonte: collector.py (yfinance info.targetMeanPrice + recommendations) + fallback deterministico</div>
        </div>
        <div class="bg-white border rounded-xl p-3">
          <div class="text-[11px] font-semibold mb-2">Score</div>
          ${[["ScoreF",selected.scoreF],["ScoreT",selected.scoreT],["ScoreTot",selected.scoreTot]].map(([k,v])=>`
            <div class="mb-2"><div class="flex justify-between text-[11px]"><span>${k}</span><span class="mono">${v}</span></div><div class="h-1.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-slate-900" style="width:${v}%"></div></div></div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
  setTimeout(()=>drawChart(),50);
}

function drawChart(){
  const canvas = document.getElementById('chart');
  if(!canvas || !selected) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const data = selected.history;
  if(!data.length) return;
  const highs = data.map(d=>d.high), lows = data.map(d=>d.low);
  let min = Math.min(...lows), max = Math.max(...highs);
  const pad=(max-min)*0.12; min-=pad; max+=pad;
  const xStep = w / data.length;
  const y = v=> h - ((v-min)/(max-min))*h;
  // candele
  data.forEach((bar,i)=>{
    const x=i*xStep + xStep*0.15; const bw=xStep*0.7;
    const isUp=bar.close>=bar.open;
    ctx.fillStyle=isUp?"#10b981":"#ef4444"; ctx.strokeStyle=isUp?"#10b981":"#ef4444";
    ctx.beginPath(); ctx.moveTo(x+bw/2, y(bar.high)); ctx.lineTo(x+bw/2, y(bar.low)); ctx.stroke();
    const top=y(Math.max(bar.open,bar.close)); const bh=Math.max(1, Math.abs(y(bar.open)-y(bar.close)));
    ctx.fillRect(x,top,bw,bh);
  });
  // SMA50
  const closes=data.map(d=>d.close);
  const sma50=calcSMA(closes,50);
  ctx.strokeStyle="#f59e0b"; ctx.lineWidth=1; ctx.beginPath(); let started=false;
  sma50.forEach((v,i)=>{ if(v===null) return; const xx=i*xStep+xStep/2; if(!started){ctx.moveTo(xx,y(v)); started=true;} else ctx.lineTo(xx,y(v)); }); ctx.stroke();
}

document.getElementById('filtroTesto').addEventListener('input', render);
document.getElementById('filtroSettore').addEventListener('change', render);
document.getElementById('btnReload').addEventListener('click', async ()=>{
  const btn = document.getElementById('btnReload');
  btn.textContent = "⏳ Aggiorno...";
  btn.disabled = true;
  try{
    if(WORKER_URL){
      log("→ Trigger workflow via Worker " + WORKER_URL + "...");
      const r = await fetch(WORKER_URL, {method:"POST"});
      if(r.ok){
        const j = await r.json();
        log("✓ Workflow lanciato (status "+j.status+") - polling tra 30s...");
        setTimeout(()=>fetchSnapshot().then(()=>{btn.textContent="🔄 Aggiorna"; btn.disabled=false;}), 30000);
        return;
      }else{
        log("⚠ Worker risponde "+r.status+", faccio solo reload raw");
      }
    }
  }catch(e){
    log("⚠ Worker errore: "+e.message+", faccio solo reload");
  }
  await fetchSnapshot();
  btn.textContent="🔄 Aggiorna";
  btn.disabled=false;
});

fetchSnapshot().catch(e=>{
  document.getElementById('statusBadge').textContent="Errore";
  document.getElementById('statusBadge').className="text-[11px] bg-red-50 text-red-700 border rounded-full px-3 py-1";
  log("✗ Errore finale: "+e.message);
  log("Verifica che fetcher.py abbia generato data/italian_stocks.json e che sia pushato su main");
});
</script>
