<html lang="it">
  <head><style>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screener Italia Pro - Formattato GitHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

      html, body {
        font-family: 'Inter', sans-serif;
      }

  <body class="bg-[#fbfaf6] text-slate-900">
    <div id="root"></div>

    <!-- React + Babel per preview leggibile -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      // ============================================================
      // CONFIG STATICO - URL nel HTML, non in localStorage
      // ============================================================
      const SNAPSHOT_URLS_STATIC = [
        "./dati/snapshot.json",
        "https://raw.githubusercontent.com/giunov-arch/Screener-Meta/main/dati/snapshot.json"
      ];

      const { useEffect, useRef, useState, useMemo } = React;

      // ------------------------------------------------------------
      // Demo fallback se fetch fallisce
      // ------------------------------------------------------------
      function generaStoriaDemo(basePrice, days) {
        const out = [];
        let price = basePrice;
        const now = new Date();
        for (let i = days - 1; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          if (d.getDay() === 0 || d.getDay() === 6) continue;
          const change = (Math.random() - 0.48) * 0.015;
          const open = price;
          const close = price * (1 + change);
          const high = Math.max(open, close) * (1 + Math.random() * 0.008);
          const low = Math.min(open, close) * (1 - Math.random() * 0.008);
          const volume = Math.floor(500000 + Math.random() * 3500000);
          out.push({
            date: d.toISOString().slice(0, 10),
            open: +open.toFixed(2),
            high: +high.toFixed(2),
            low: +low.toFixed(2),
            close: +close.toFixed(2),
            volume,
          });
          price = close;
        }
        return out;
      }

      function creaDemoSnapshot() {
        const base = [
          { ticker: "ENI.MI", nome: "Eni SpA", settore: "Energy", price: 14.82 },
          { ticker: "ENEL.MI", nome: "Enel", settore: "Utilities", price: 6.95 },
          { ticker: "ISP.MI", nome: "Intesa", settore: "Banche", price: 3.42 },
          { ticker: "UCG.MI", nome: "UniCredit", settore: "Banche", price: 38.1 },
        ];
        const titoli = base.map(b => {
          const history = generaStoriaDemo(b.price, 620);
          const last = history[history.length - 1];
          return {
            ticker: b.ticker,
            nome: b.nome,
            prezzo: last.close,
            pe: +(8 + Math.random() * 18).toFixed(1),
            roe: +(5 + Math.random() * 25).toFixed(1),
            divYield: +(2 + Math.random() * 6).toFixed(2),
            cet1: +(13 + Math.random() * 3).toFixed(2),
            distSMA200: +(-15 + Math.random() * 30).toFixed(1),
            dist52w: +(-20 + Math.random() * 90).toFixed(1),
            score: Math.floor(40 + Math.random() * 55),
            settore: b.settore,
            fondamentali: { prezzo: last.close, pe: 12, pb: 1.2, roe: 15, divYield: 5, cet1: 14, evEbitda: 6, debtEquity: 0.5, margineNetto: 10, crescitaRicavi: 5, fcfYield: 4, beta: 1.1, marketCap: 20 },
            consenso: { rating: "Buy", targetPrice: last.close * 1.2, numAnalysts: 18, upside: 15, buy: 12, hold: 4, sell: 1 },
            history,
          };
        });
        return { generatedAt: new Date().toISOString(), titoli };
      }

      // ------------------------------------------------------------
      // CALCOLI INDICATORI
      // ------------------------------------------------------------
      function calcSMA(values, period) {
        const res = [];
        let sum = 0;
        for (let i = 0; i < values.length; i++) {
          sum += values[i];
          if (i >= period) sum -= values[i - period];
          res.push(i >= period - 1 ? sum / period : null);
        }
        return res;
      }

      function calcEMA(values, period) {
        const res = [];
        const k = 2 / (period + 1);
        let ema = values[0];
        for (let i = 0; i < values.length; i++) {
          if (i === 0) ema = values[0];
          else ema = values[i] * k + ema * (1 - k);
          res.push(i >= period - 1 ? ema : null);
        }
        return res;
      }

      function calcBollinger(closes, period = 20, mult = 2) {
        const sma = calcSMA(closes, period);
        const upper = [], lower = [], middle = sma;
        for (let i = 0; i < closes.length; i++) {
          if (i < period - 1 || sma[i] === null) {
            upper.push(null); lower.push(null);
          } else {
            let sumSq = 0;
            for (let j = i - period + 1; j <= i; j++) {
              sumSq += Math.pow(closes[j] - sma[i], 2);
            }
            const std = Math.sqrt(sumSq / period);
            upper.push(sma[i] + mult * std);
            lower.push(sma[i] - mult * std);
          }
        }
        return { middle, upper, lower };
      }

      function calcRSI(closes, period = 14) {
        const rsi = [];
        let gain = 0, loss = 0;
        for (let i = 0; i < closes.length; i++) {
          if (i === 0) { rsi.push(null); continue; }
          const diff = closes[i] - closes[i - 1];
          if (i <= period) {
            if (diff > 0) gain += diff; else loss -= diff;
            if (i < period) { rsi.push(null); continue; }
            gain /= period; loss /= period;
          } else {
            if (diff > 0) { gain = (gain * (period - 1) + diff) / period; loss = (loss * (period - 1)) / period; }
            else { gain = (gain * (period - 1)) / period; loss = (loss * (period - 1) - diff) / period; }
          }
          const rs = loss === 0 ? 100 : gain / loss;
          rsi.push(100 - (100 / (1 + rs)));
        }
        return rsi;
      }

      function calcMACD(closes) {
        const ema12 = calcEMA(closes, 12);
        const ema26 = calcEMA(closes, 26);
        const macdLine = closes.map((_, i) => ema12[i] !== null && ema26[i] !== null ? ema12[i] - ema26[i] : null);
        const validMacd = macdLine.filter(v => v !== null);
        const signalRaw = calcEMA(validMacd.length ? validMacd : closes, 9);
        // allinea signal
        let sigIdx = 0;
        const signalLine = macdLine.map(v => {
          if (v === null) return null;
          const s = signalRaw[sigIdx] ?? null;
          sigIdx++;
          return s;
        });
        const histogram = macdLine.map((v, i) => v !== null && signalLine[i] !== null ? v - signalLine[i] : null);
        return { macdLine, signalLine, histogram };
      }

      function resampleDailyToWeekly(daily) {
        if (!daily || daily.length === 0) return [];
        const weeks = {};
        daily.forEach(bar => {
          const d = new Date(bar.date);
          const year = d.getFullYear();
          const jan1 = new Date(year, 0, 1);
          const week = Math.ceil((((d - jan1) / 86400000) + jan1.getDay() + 1) / 7);
          const key = `${year}-W${week}`;
          if (!weeks[key]) weeks[key] = [];
          weeks[key].push(bar);
        });
        const weekly = Object.values(weeks).map(group => {
          const first = group[0];
          const last = group[group.length - 1];
          return {
            date: last.date,
            open: first.open,
            high: Math.max(...group.map(g => g.high)),
            low: Math.min(...group.map(g => g.low)),
            close: last.close,
            volume: group.reduce((s, g) => s + g.volume, 0),
          };
        });
        return weekly.sort((a, b) => new Date(a.date) - new Date(b.date));
      }

      // ------------------------------------------------------------
      // APP
      // ------------------------------------------------------------
      function App() {
        const [snapshot, setSnapshot] = useState(null);
        const [log, setLog] = useState(["Pronto."]);
        const [selected, setSelected] = useState(null);
        const [timeframe, setTimeframe] = useState("1Y");
        const [isWeekly, setIsWeekly] = useState(false);
        const [showSMA20, setShowSMA20] = useState(false);
        const [showSMA50, setShowSMA50] = useState(true);
        const [showSMA200, setShowSMA200] = useState(true);
        const [showBB, setShowBB] = useState(false);
        const [showRSI, setShowRSI] = useState(true);
        const [showMACD, setShowMACD] = useState(true);
        const [hoverIdx, setHoverIdx] = useState(null);

        const priceRef = useRef(null);
        const rsiRef = useRef(null);
        const macdRef = useRef(null);

        const tfMap = { "1M": 22, "3M": 63, "6M": 126, "1Y": 252, "2Y": 500, "MAX": 99999 };

        useEffect(() => {
          async function load() {
            for (let url of SNAPSHOT_URLS_STATIC) {
              try {
                const r = await fetch(url, { cache: "no-store" });
                if (!r.ok) throw new Error(r.status);
                const j = await r.json();
                // adatta formato: se è {titoli:[{barre:[{o,h,l,c}]}]} oppure array
                let titoli = [];
                if (j.titoli) titoli = j.titoli.map(t => ({
                  ticker: t.ticker || t.Ticker,
                  nome: t.nome || t.Nome || t.ticker,
                  prezzo: t.prezzo || t.Prezzo || t.barre?.[t.barre.length-1]?.c || 0,
                  pe: t.f?.pe || t.PE || 0,
                  roe: t.f?.roe || t.ROE || 0,
                  divYield: t.f?.divYield || t.DivYield || 0,
                  cet1: t.f?.cet1 || 0,
                  distSMA200: t.DistSMA200 || 0,
                  dist52w: t.Dist52w || 0,
                  score: 50,
                  settore: t.settore || t.Settore || "Altro",
                  fondamentali: t.f || {},
                  consenso: t.con || { rating: "Hold", targetPrice: 0, numAnalysts: 0, upside: 0, buy: 0, hold: 0, sell: 0 },
                  history: (t.barre || []).map(b => ({
                    date: b.d || b.date,
                    open: b.o ?? b.open,
                    high: b.h ?? b.high,
                    low: b.l ?? b.low,
                    close: b.c ?? b.close,
                    volume: b.v ?? b.volume ?? 0
                  }))
                }));
                else if (Array.isArray(j)) titoli = j.map(t => ({
                  ticker: t.Ticker, nome: t.Ticker, prezzo: t.Prezzo, pe: t.PE, roe: t.ROE, divYield: t.DivYield, cet1: 0, distSMA200: t.DistSMA200, dist52w: t.Dist52w, score: 50, settore: "Altro", fondamentali: t, consenso: {}, history: generaStoriaDemo(t.Prezzo||10, 620)
                }));

                setSnapshot({ generatedAt: j.generato_il || new Date().toISOString(), titoli });
                setSelected(titoli[0]);
                setLog(l => [...l, `✓ Caricati ${titoli.length} titoli da ${url}`]);
                return;
              } catch(e) {
                setLog(l => [...l, `✗ ${url} ${e.message}`]);
              }
            }
            // fallback demo
            const demo = creaDemoSnapshot();
            setSnapshot(demo);
            setSelected(demo.titoli[0]);
          }
          load();
        }, []);

        const chartData = useMemo(() => {
          if (!selected) return [];
          let data = isWeekly ? resampleDailyToWeekly(selected.history) : selected.history;
          const n = tfMap[timeframe] || 252;
          return data.slice(-n);
        }, [selected, timeframe, isWeekly]);

        const indicators = useMemo(() => {
          const closes = chartData.map(c => c.close);
          return {
            sma20: calcSMA(closes, 20),
            sma50: calcSMA(closes, 50),
            sma200: calcSMA(closes, 200),
            bb: calcBollinger(closes, 20, 2),
            rsi: calcRSI(closes, 14),
            macd: calcMACD(closes),
          };
        }, [chartData]);

        useEffect(() => {
          if (!chartData.length) return;
          drawPrice(priceRef.current, chartData, indicators, { showSMA20, showSMA50, showSMA200, showBB, hoverIdx });
          if (showRSI) drawRSI(rsiRef.current, indicators.rsi, hoverIdx);
          if (showMACD) drawMACD(macdRef.current, indicators.macd, hoverIdx);
        }, [chartData, indicators, showSMA20, showSMA50, showSMA200, showBB, showRSI, showMACD, hoverIdx]);

        function handleMouseMove(e) {
          const rect = e.target.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const idx = Math.floor((x / rect.width) * chartData.length);
          setHoverIdx(Math.max(0, Math.min(chartData.length - 1, idx)));
        }

        if (!snapshot) return <div className="p-8">Caricamento...</div>;

        return (
          <div className="max-w-[1600px] mx-auto px-4 py-6">
            <header className="flex justify-between items-center mb-6">
              <h1 className="text-xl font-bold">Screener Italia Pro - Formattato</h1>
              <div className="text-xs text-slate-500">{snapshot.generatedAt?.slice(0,10)} • {snapshot.titoli.length} titoli • URL statico in HTML</div>
            </header>

            <div className="grid grid-cols-12 gap-4">
              <aside className="col-span-12 lg:col-span-3 space-y-3">
                <div className="bg-white border rounded-xl p-3 text-xs">
                  <div className="font-semibold mb-2">Connessione Dati (statico)</div>
                  <code className="block bg-slate-50 p-2 rounded text-[11px] break-all">
                    {SNAPSHOT_URLS_STATIC[0]}
                  </code>
                  <div className="mt-2 h-20 overflow-auto bg-slate-50 p-2 rounded text-[10px]">{log.map((l,i)=><div key={i}>{l}</div>)}</div>
                </div>
                <div className="bg-white border rounded-xl overflow-hidden">
                  <div className="max-h-[70vh] overflow-auto">
                    {snapshot.titoli.map(t=>(
                      <button key={t.ticker} onClick={()=>setSelected(t)} className={`w-full text-left px-3 py-2 text-xs border-b hover:bg-slate-50 ${selected?.ticker===t.ticker?'bg-slate-900 text-white':''}`}>
                        <div className="font-semibold">{t.ticker}</div>
                        <div className="truncate opacity-70">{t.nome} • {t.prezzo}</div>
                      </button>
                    ))}
                  </div>
                </div>
              </aside>

              <main className="col-span-12 lg:col-span-9">
                {selected && (
                  <div className="bg-white border rounded-xl overflow-hidden">
                    <div className="p-4 border-b flex flex-wrap gap-2 items-center">
                      <h2 className="font-bold">{selected.ticker} - {selected.nome}</h2>
                      <div className="ml-auto flex gap-1">
                        {Object.keys(tfMap).map(tf=>(
                          <button key={tf} onClick={()=>setTimeframe(tf)} className={`px-2.5 py-1 rounded-full text-[11px] ${timeframe===tf?'bg-slate-900 text-white':'bg-slate-100'}`}>{tf}</button>
                        ))}
                        <span className="w-px bg-slate-200 mx-1"></span>
                        <button onClick={()=>setIsWeekly(false)} className={`px-3 py-1 rounded-full text-[11px] ${!isWeekly?'bg-slate-900 text-white':'bg-slate-100'}`}>D</button>
                        <button onClick={()=>setIsWeekly(true)} className={`px-3 py-1 rounded-full text-[11px] ${isWeekly?'bg-slate-900 text-white':'bg-slate-100'}`}>W</button>
                      </div>
                    </div>
                    <div className="p-3 flex gap-3 text-[11px] flex-wrap border-b bg-slate-50">
                      <label><input type="checkbox" checked={showSMA20} onChange={e=>setShowSMA20(e.target.checked)}/> SMA20</label>
                      <label><input type="checkbox" checked={showSMA50} onChange={e=>setShowSMA50(e.target.checked)}/> SMA50</label>
                      <label><input type="checkbox" checked={showSMA200} onChange={e=>setShowSMA200(e.target.checked)}/> SMA200</label>
                      <label><input type="checkbox" checked={showBB} onChange={e=>setShowBB(e.target.checked)}/> Bollinger</label>
                      <label><input type="checkbox" checked={showRSI} onChange={e=>setShowRSI(e.target.checked)}/> RSI</label>
                      <label><input type="checkbox" checked={showMACD} onChange={e=>setShowMACD(e.target.checked)}/> MACD</label>
                    </div>
                    {hoverIdx!==null && chartData[hoverIdx] && (
                      <div className="px-4 py-2 bg-[#fcfcf9] border-b text-[11px] flex gap-3">
                        <span>{chartData[hoverIdx].date}</span>
                        <span>O {chartData[hoverIdx].open}</span>
                        <span>H {chartData[hoverIdx].high}</span>
                        <span>L {chartData[hoverIdx].low}</span>
                        <span className="font-bold">C {chartData[hoverIdx].close}</span>
                        {indicators.rsi[hoverIdx] && <span>RSI {indicators.rsi[hoverIdx].toFixed(1)}</span>}
                      </div>
                    )}
                    <canvas ref={priceRef} onMouseMove={handleMouseMove} onMouseLeave={()=>setHoverIdx(null)} style={{width:"100%", height:"360px"}} />
                    {showRSI && <canvas ref={rsiRef} onMouseMove={handleMouseMove} onMouseLeave={()=>setHoverIdx(null)} style={{width:"100%", height:"120px", borderTop:"1px solid #e2e8f0"}} />}
                    {showMACD && <canvas ref={macdRef} onMouseMove={handleMouseMove} onMouseLeave={()=>setHoverIdx(null)} style={{width:"100%", height:"140px", borderTop:"1px solid #e2e8f0"}} />}
                  </div>
                )}
              </main>
            </div>
          </div>
        );
      }

      function drawPrice(canvas, data, ind, opts) {
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.clientWidth, h = canvas.clientHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.clearRect(0,0,w,h);
        if (!data.length) return;
        const highs = data.map(d=>d.high), lows = data.map(d=>d.low);
        let min = Math.min(...lows), max = Math.max(...highs);
        const pad = (max-min)*0.1; min-=pad; max+=pad;
        const xStep = w / data.length;
        const y = v => h - ((v-min)/(max-min))*h;

        // Bollinger fill
        if (opts.showBB && ind.bb.upper[0]!==null) {
          ctx.fillStyle = "rgba(99,102,241,0.08)";
          ctx.beginPath();
          for (let i=0;i<data.length;i++) if (ind.bb.upper[i]!==null) ctx.lineTo(i*xStep, y(ind.bb.upper[i]));
          for (let i=data.length-1;i>=0;i--) if (ind.bb.lower[i]!==null) ctx.lineTo(i*xStep, y(ind.bb.lower[i]));
          ctx.closePath(); ctx.fill();
        }

        // Candele
        data.forEach((bar,i)=>{
          const x = i*xStep + xStep*0.15;
          const bw = xStep*0.7;
          const isUp = bar.close >= bar.open;
          ctx.fillStyle = isUp ? "#10b981" : "#ef4444";
          ctx.strokeStyle = isUp ? "#10b981" : "#ef4444";
          ctx.beginPath();
          ctx.moveTo(x+bw/2, y(bar.high));
          ctx.lineTo(x+bw/2, y(bar.low));
          ctx.stroke();
          const top = y(Math.max(bar.open, bar.close));
          const bh = Math.max(1, Math.abs(y(bar.open)-y(bar.close)));
          ctx.fillRect(x, top, bw, bh);
        });

        function drawLine(arr, color, dash) {
          ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.setLineDash(dash||[]);
          ctx.beginPath();
          let started=false;
          arr.forEach((v,i)=>{ if(v===null) return; if(!started){ctx.moveTo(i*xStep+xStep/2, y(v)); started=true;} else ctx.lineTo(i*xStep+xStep/2, y(v)); });
          ctx.stroke(); ctx.setLineDash([]);
        }
        if (opts.showSMA20) drawLine(ind.sma20, "#0ea5e9");
        if (opts.showSMA50) drawLine(ind.sma50, "#f59e0b");
        if (opts.showSMA200) drawLine(ind.sma200, "#8b5cf6", [4,4]);
        if (opts.showBB) { drawLine(ind.bb.upper, "#6366f1", [4,4]); drawLine(ind.bb.lower, "#6366f1", [4,4]); }

        if (opts.hoverIdx!==null && opts.hoverIdx>=0) {
          const x = opts.hoverIdx*xStep + xStep/2;
          ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
        }
      }

      function drawRSI(canvas, rsi, hoverIdx) {
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio||1;
        const w=canvas.clientWidth, h=canvas.clientHeight;
        canvas.width=w*dpr; canvas.height=h*dpr;
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.clearRect(0,0,w,h);
        ctx.strokeStyle="#e2e8f0"; ctx.setLineDash([4,4]);
        [30,70].forEach(v=>{ const yy=h - (v/100)*h; ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(w,yy); ctx.stroke(); });
        ctx.setLineDash([]);
        ctx.strokeStyle="#6366f1"; ctx.beginPath();
        let started=false;
        rsi.forEach((v,i)=>{ if(v===null) return; const x=i/w*rsi.length ? i/rsi.length*w : 0; const xx=i/rsi.length*w; const yy=h - (v/100)*h; if(!started){ctx.moveTo(xx,yy); started=true;} else ctx.lineTo(xx,yy); });
        // corretto xStep
        const xStep=w/rsi.length;
        ctx.beginPath(); started=false;
        rsi.forEach((v,i)=>{ if(v===null) return; const xx=i*xStep+xStep/2; const yy=h - (v/100)*h; if(!started){ctx.moveTo(xx,yy); started=true;} else ctx.lineTo(xx,yy); });
        ctx.stroke();
        if (hoverIdx!==null) { const x=hoverIdx*xStep+xStep/2; ctx.strokeStyle="rgba(0,0,0,0.15)"; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
      }

      function drawMACD(canvas, macd, hoverIdx) {
        if (!canvas) return;
        const ctx=canvas.getContext("2d");
        const dpr=window.devicePixelRatio||1;
        const w=canvas.clientWidth, h=canvas.clientHeight;
        canvas.width=w*dpr; canvas.height=h*dpr;
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.clearRect(0,0,w,h);
        const all = [...macd.macdLine.filter(v=>v!==null), ...macd.signalLine.filter(v=>v!==null), ...macd.histogram.filter(v=>v!==null)];
        if (!all.length) return;
        let min=Math.min(...all), max=Math.max(...all); const pad=(max-min)*0.1||1; min-=pad; max+=pad;
        const y=v=>h - ((v-min)/(max-min))*h;
        const xStep=w/macd.macdLine.length;
        const zeroY=y(0);
