  <body class="bg-[#fbfaf6] text-slate-900">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      // ============================================================
      // TEMPLATE BASE v3.1 - Finale No Proxy
      // Tabella snella fino a SCORET • Settings grafico sopra grafico
      // NO Stooq • NO allorigins • NO proxy pubblici • NO TwelveData
      // Unica fonte: GitHub Actions (collector.py) + Worker trigger 1-click
      // ============================================================
      const SNAPSHOT_URLS_STATIC = [
        "./dati/snapshot.json",
        "https://raw.githubusercontent.com/giunov-arch/Screener-Meta/main/dati/snapshot.json"
      ];

      // Sostituisci con URL del tuo Worker dopo deploy
      // Se vuoto, il tasto fa solo reload da GitHub raw (nessun proxy)
      const WORKER_URL = "https://rapid-paper-5635.giunov.workers.dev";

      const { useEffect, useRef, useState, useMemo } = React;

      // ------------------------------------------------------------
      // Demo fallback offline
      // ------------------------------------------------------------
      function generaStoriaDemo(basePrice, days) {
        const out = [];
        let price = basePrice;
        const now = new Date();
        for (let i = days - 1; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          if (d.getDay() === 0 || d.getDay() === 6) continue;
          const change = (Math.random() - 0.48) * 0.015;
          const open = price;
          const close = price * (1 + change);
          const high = Math.max(open, close) * (1 + Math.random() * 0.008);
          const low = Math.min(open, close) * (1 - Math.random() * 0.008);
          const volume = Math.floor(500000 + Math.random() * 3500000);
          out.push({
            date: d.toISOString().slice(0, 10),
            open: +open.toFixed(2),
            high: +high.toFixed(2),
            low: +low.toFixed(2),
            close: +close.toFixed(2),
            volume,
          });
          price = close;
        }
        return out;
      }

      function creaDemoSnapshot() {
        const base = [
          { ticker: "ENI.MI", nome: "Eni SpA", settore: "Energy", price: 14.82 },
          { ticker: "ENEL.MI", nome: "Enel", settore: "Utilities", price: 6.95 },
          { ticker: "ISP.MI", nome: "Intesa Sanpaolo", settore: "Banche", price: 3.42 },
          { ticker: "UCG.MI", nome: "UniCredit", settore: "Banche", price: 38.1 },
          { ticker: "G.MI", nome: "Generali", settore: "Assicurazioni", price: 22.4 },
        ];
        const titoli = base.map(b => {
          const history = generaStoriaDemo(b.price, 620);
          const last = history[history.length - 1];
          return {
            ticker: b.ticker,
            nome: b.nome,
            settore: b.settore,
            prezzo: last.close,
            pe: +(5 + Math.random() * 15).toFixed(1),
            pb: +(0.8 + Math.random() * 3).toFixed(2),
            roe: +(8 + Math.random() * 20).toFixed(1),
            divYield: +(2 + Math.random() * 6).toFixed(2),
            cet1: b.settore === "Banche" ? +(13 + Math.random() * 3).toFixed(2) : 0,
            evEbitda: +(4 + Math.random() * 10).toFixed(1),
            debtEquity: +(0.1 + Math.random() * 1.2).toFixed(2),
            margineNetto: +(3 + Math.random() * 22).toFixed(1),
            crescitaRicavi: +(-2 + Math.random() * 12).toFixed(1),
            fcfYield: +(2 + Math.random() * 9).toFixed(1),
            beta: +(0.7 + Math.random() * 0.8).toFixed(2),
            marketCap: +(2 + Math.random() * 60).toFixed(1),
            distSMA200: +(-15 + Math.random() * 30).toFixed(1),
            dist52w: +(-20 + Math.random() * 90).toFixed(1),
            scoreF: Math.floor(40 + Math.random() * 50),
            scoreT: Math.floor(30 + Math.random() * 60),
            scoreTot: 0,
            fondamentali: {},
            consenso: { rating: "Buy", targetPrice: +(last.close * 1.2).toFixed(2), upside: 18, buy: 12, hold: 4, sell: 1, numAnalysts: 17 },
            history,
          };
        });
        titoli.forEach(t => t.scoreTot = Math.round((t.scoreF + t.scoreT) / 2));
        return { generatedAt: new Date().toISOString(), titoli };
      }

      // ------------------------------------------------------------
      // Calcoli indicatori - vanilla, commenti italiano
      // ------------------------------------------------------------
      function calcSMA(values, period) {
        const res = [];
        let sum = 0;
        for (let i = 0; i < values.length; i++) {
          sum += values[i];
          if (i >= period) sum -= values[i - period];
          res.push(i >= period - 1 ? sum / period : null);
        }
        return res;
      }

      function calcEMA(values, period) {
        const res = [];
        const k = 2 / (period + 1);
        let ema = values[0] || 0;
        for (let i = 0; i < values.length; i++) {
          if (i === 0) ema = values[0];
          else ema = values[i] * k + ema * (1 - k);
          res.push(i >= period - 1 ? ema : null);
        }
        return res;
      }

      function calcBollinger(closes, period = 20, mult = 2) {
        const sma = calcSMA(closes, period);
        const upper = [], lower = [];
        for (let i = 0; i < closes.length; i++) {
          if (i < period - 1 || sma[i] === null) {
            upper.push(null); lower.push(null);
          } else {
            let sumSq = 0;
            for (let j = i - period + 1; j <= i; j++) sumSq += Math.pow(closes[j] - sma[i], 2);
            const std = Math.sqrt(sumSq / period);
            upper.push(sma[i] + mult * std);
            lower.push(sma[i] - mult * std);
          }
        }
        return { middle: sma, upper, lower };
      }

      function calcRSI(closes, period = 14) {
        const rsi = [];
        let gain = 0, loss = 0;
        for (let i = 0; i < closes.length; i++) {
          if (i === 0) { rsi.push(null); continue; }
          const diff = closes[i] - closes[i - 1];
          if (i <= period) {
            if (diff > 0) gain += diff; else loss -= diff;
            if (i < period) { rsi.push(null); continue; }
            gain /= period; loss /= period;
          } else {
            if (diff > 0) { gain = (gain * (period - 1) + diff) / period; loss = (loss * (period - 1)) / period; }
            else { gain = (gain * (period - 1)) / period; loss = (loss * (period - 1) - diff) / period; }
          }
          const rs = loss === 0 ? 100 : gain / loss;
          rsi.push(100 - (100 / (1 + rs)));
        }
        return rsi;
      }

      function calcMACD(closes) {
        const ema12 = calcEMA(closes, 12);
        const ema26 = calcEMA(closes, 26);
        const macdLine = closes.map((_, i) => ema12[i] !== null && ema26[i] !== null ? ema12[i] - ema26[i] : null);
        const valid = macdLine.filter(v => v !== null);
        const signalRaw = calcEMA(valid, 9);
        let idx = 0;
        const signalLine = macdLine.map(v => {
          if (v === null) return null;
          return signalRaw[idx++] ?? null;
        });
        const histogram = macdLine.map((v, i) => v !== null && signalLine[i] !== null ? v - signalLine[i] : null);
        return { macdLine, signalLine, histogram };
      }

      function resampleDailyToWeekly(daily) {
        if (!daily || !daily.length) return [];
        const weeks = {};
        daily.forEach(bar => {
          const d = new Date(bar.date);
          const year = d.getFullYear();
          const jan1 = new Date(year, 0, 1);
          const week = Math.ceil((((d - jan1) / 86400000) + jan1.getDay() + 1) / 7);
          const key = `${year}-W${week}`;
          if (!weeks[key]) weeks[key] = [];
          weeks[key].push(bar);
        });
        return Object.values(weeks).map(g => {
          const first = g[0], last = g[g.length - 1];
          return {
            date: last.date,
            open: first.open,
            high: Math.max(...g.map(x => x.high)),
            low: Math.min(...g.map(x => x.low)),
            close: last.close,
            volume: g.reduce((s, x) => s + x.volume, 0),
          };
        }).sort((a, b) => new Date(a.date) - new Date(b.date));
      }

      function detectPatterns(data, ind) {
        if (!data.length) return {};
        const i = data.length - 1;
        const close = data[i].close;
        const upper = ind.bb.upper[i], lower = ind.bb.lower[i];
        const rsi = ind.rsi[i];
        const macd = ind.macd.macdLine[i], signal = ind.macd.signalLine[i];
        const macdPrev = ind.macd.macdLine[i-1], signalPrev = ind.macd.signalLine[i-1];
        const sma50 = ind.sma50[i], sma200 = ind.sma200[i];
        const sma50Prev = ind.sma50[i-1], sma200Prev = ind.sma200[i-1];
        return {
          bollingerBreakout: upper !== null && close > upper,
          bollingerBreakdown: lower !== null && close < lower,
          bollingerSqueeze: upper !== null && lower !== null && ind.bb.middle[i] !== null && ((upper - lower) / ind.bb.middle[i]) < 0.08,
          macdBullishCross: macdPrev !== null && signalPrev !== null && macd !== null && signal !== null && macdPrev <= signalPrev && macd > signal,
          macdBearishCross: macdPrev !== null && signalPrev !== null && macd !== null && signal !== null && macdPrev >= signalPrev && macd < signal,
          macdBullish: macd !== null && signal !== null && macd > signal,
          goldenCross: sma50Prev !== null && sma200Prev !== null && sma50 !== null && sma200 !== null && sma50Prev <= sma200Prev && sma50 > sma200,
          deathCross: sma50Prev !== null && sma200Prev !== null && sma50 !== null && sma200 !== null && sma50Prev >= sma200Prev && sma50 < sma200,
          rsiOverbought: rsi !== null && rsi > 70,
          rsiOversold: rsi !== null && rsi < 30,
          trendRialzista: sma50 !== null && sma200 !== null && close > sma50 && sma50 > sma200,
          trendRibassista: sma50 !== null && sma200 !== null && close < sma50 && sma50 < sma200,
          pullbackSMA50: sma50 !== null && Math.abs(close - sma50) / sma50 < 0.02,
        };
      }

      // ------------------------------------------------------------
      // App principale
      // ------------------------------------------------------------
      function App() {
        const [snapshot, setSnapshot] = useState(null);
        const [log, setLog] = useState(["Pronto. Fonte: GitHub Actions (collector.py) — NO proxy pubblici"]);
        const [selected, setSelected] = useState(null);
        const [filtroTesto, setFiltroTesto] = useState("");
        const [filtroSettore, setFiltroSettore] = useState("Tutti");
        const [filtroPE, setFiltroPE] = useState(100);
        const [filtroPattern, setFiltroPattern] = useState({});
        const [timeframe, setTimeframe] = useState("1Y");
        const [isWeekly, setIsWeekly] = useState(false);
        const [showSMA20, setShowSMA20] = useState(false);
        const [showSMA50, setShowSMA50] = useState(true);
        const [showSMA200, setShowSMA200] = useState(true);
        const [showBB, setShowBB] = useState(true);
        const [showVol, setShowVol] = useState(true);
        const [showRSI, setShowRSI] = useState(true);
        const [showMACD, setShowMACD] = useState(true);
        const [hoverIdx, setHoverIdx] = useState(null);
        const [isUpdating, setIsUpdating] = useState(false);
        const [progress, setProgress] = useState(0);
        const [pollingCount, setPollingCount] = useState(0);

        const priceRef = useRef(null);
        const rsiRef = useRef(null);
        const macdRef = useRef(null);

        const tfMap = { "1M": 22, "3M": 63, "6M": 126, "1Y": 252, "2Y": 500, "MAX": 99999 };

        function addLog(msg) {
          setLog(l => [...l.slice(-20), msg]);
        }

        async function fetchLatestSnapshot() {
          addLog("→ Controllo snapshot da GitHub raw con cache bust...");
          for (let url of SNAPSHOT_URLS_STATIC) {
            try {
              const bustUrl = url + (url.includes("?") ? "&" : "?") + "v=" + Date.now();
              const r = await fetch(bustUrl, { cache: "no-store" });
              if (!r.ok) throw new Error(r.status);
              const j = await r.json();
              let titoli = [];
              if (j.titoli) {
                titoli = j.titoli.map(t => ({
                  ticker: t.ticker || t.Ticker,
                  nome: t.nome || t.Nome || t.ticker,
                  settore: t.settore || t.Settore || "Altro",
                  prezzo: t.prezzo || t.Prezzo || t.barre?.[t.barre.length-1]?.c || 0,
                  pe: t.f?.pe ?? t.PE ?? 0,
                  pb: t.f?.pb ?? t.PB ?? 0,
                  roe: t.f?.roe ?? t.ROE ?? 0,
                  divYield: t.f?.divYield ?? t.DivYield ?? 0,
                  cet1: t.f?.cet1 ?? 0,
                  evEbitda: t.f?.evEbitda ?? 0,
                  debtEquity: t.f?.debtEquity ?? 0,
                  margineNetto: t.f?.margine ?? 0,
                  crescitaRicavi: t.f?.crescitaRic ?? 0,
                  fcfYield: t.f?.fcfYield ?? 0,
                  beta: t.f?.beta ?? 1,
                  marketCap: t.f?.mcap ?? 0,
                  distSMA200: t.DistSMA200 ?? 0,
                  dist52w: t.Dist52w ?? 0,
                  scoreF: Math.floor(40 + Math.random() * 50),
                  scoreT: Math.floor(30 + Math.random() * 60),
                  scoreTot: 0,
                  consenso: t.con || { rating: "Hold", targetPrice: 0, upside: 0, buy: 0, hold: 0, sell: 0, numAnalysts: 0 },
                  history: (t.barre || []).map(b => ({
                    date: b.d || b.date,
                    open: b.o ?? b.open,
                    high: b.h ?? b.high,
                    low: b.l ?? b.low,
                    close: b.c ?? b.close,
                    volume: b.v ?? b.volume ?? 0
                  }))
                }));
              }
              if (!titoli.length) throw new Error("vuoto");
              titoli.forEach(t => t.scoreTot = Math.round((t.scoreF + t.scoreT) / 2));
              const snap = { generatedAt: j.generato_il || new Date().toISOString(), titoli };
              setSnapshot(snap);
              if (!selected) setSelected(titoli[0]);
              addLog(`✓ Snapshot trovato: ${new Date(snap.generatedAt).toLocaleString('it-IT')} (${titoli.length} titoli) da ${url.includes('raw') ? 'GitHub raw' : 'locale'}`);
              return snap;
            } catch (e) {
              addLog(`✗ ${url} → ${e.message}`);
            }
          }
          throw new Error("Snapshot non disponibile");
        }

        useEffect(() => {
          fetchLatestSnapshot().catch(() => {
            const demo = creaDemoSnapshot();
            setSnapshot(demo);
            setSelected(demo.titoli[0]);
            addLog("⚠ Uso dati demo offline (GitHub non raggiungibile)");
          });
        }, []);

        const settori = useMemo(() => {
          if (!snapshot) return ["Tutti"];
          const s = new Set(snapshot.titoli.map(t => t.settore));
          return ["Tutti", ...Array.from(s)];
        }, [snapshot]);

        const chartData = useMemo(() => {
          if (!selected) return [];
          let data = isWeekly ? resampleDailyToWeekly(selected.history) : selected.history;
          const n = tfMap[timeframe] || 252;
          return data.slice(-n);
        }, [selected, timeframe, isWeekly]);

        const indicators = useMemo(() => {
          const closes = chartData.map(c => c.close);
          return {
            sma20: calcSMA(closes, 20),
            sma50: calcSMA(closes, 50),
            sma200: calcSMA(closes, 200),
            bb: calcBollinger(closes, 20, 2),
            rsi: calcRSI(closes, 14),
            macd: calcMACD(closes),
          };
        }, [chartData]);

        const patterns = useMemo(() => detectPatterns(chartData, indicators), [chartData, indicators]);

        const titoliFiltrati = useMemo(() => {
          if (!snapshot) return [];
          return snapshot.titoli.filter(t => {
            if (filtroTesto && !`${t.ticker} ${t.nome}`.toLowerCase().includes(filtroTesto.toLowerCase())) return false;
            if (filtroSettore !== "Tutti" && t.settore !== filtroSettore) return false;
            if (t.pe && t.pe > filtroPE) return false;
            if (Object.keys(filtroPattern).some(k => filtroPattern[k])) {
              const closes = t.history.map(h => h.close);
              const sma50 = calcSMA(closes, 50), sma200 = calcSMA(closes, 200);
              const bb = calcBollinger(closes, 20, 2), rsi = calcRSI(closes, 14), macd = calcMACD(closes);
              const data = t.history.slice(-100);
              const ind = { sma50: sma50.slice(-100), sma200: sma200.slice(-100), bb: { upper: bb.upper.slice(-100), lower: bb.lower.slice(-100), middle: bb.middle.slice(-100) }, rsi: rsi.slice(-100), macd };
              const p = detectPatterns(data, { sma50: ind.sma50, sma200: ind.sma200, bb: ind.bb, rsi: ind.rsi, macd: ind.macd, sma20: [] });
              for (let k in filtroPattern) if (filtroPattern[k] && !p[k]) return false;
            }
            return true;
          });
        }, [snapshot, filtroTesto, filtroSettore, filtroPE, filtroPattern]);

        useEffect(() => {
          if (!chartData.length) return;
          drawPrice(priceRef.current, chartData, indicators, { showSMA20, showSMA50, showSMA200, showBB, showVol, hoverIdx });
          if (showRSI) drawRSI(rsiRef.current, indicators.rsi, hoverIdx);
          if (showMACD) drawMACD(macdRef.current, indicators.macd, hoverIdx);
        }, [chartData, indicators, showSMA20, showSMA50, showSMA200, showBB, showVol, showRSI, showMACD, hoverIdx]);

        function handleMouseMove(e) {
          const rect = e.target.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const idx = Math.floor((x / rect.width) * chartData.length);
          setHoverIdx(Math.max(0, Math.min(chartData.length - 1, idx)));
        }

        // ------------------------------------------------------------
        // Nuovo meccanismo aggiornamento - NO proxy
        // ------------------------------------------------------------
        async function aggiornaPrezzi() {
          if (isUpdating) return;
          setIsUpdating(true);
          setProgress(5);
          addLog("→ Avvio aggiornamento automatico (NO proxy pubblici)...");
          addLog(`→ Sorgente unica: GitHub Actions (collector.py) via ${SNAPSHOT_URLS_STATIC[1]}`);

          try {
            // Tentativo trigger via Worker (se deployato)
            addLog(`→ Tentativo trigger workflow via Worker ${WORKER_URL}...`);
            let workerOk = false;
            try {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 5000);
              const r = await fetch(WORKER_URL, { method: "POST", signal: controller.signal });
              clearTimeout(timeout);
              if (r.ok) {
                const j = await r.json();
                if (j.ok) {
                  workerOk = true;
                  addLog(`✓ Workflow fetch.yml lanciato via Worker (status ${j.status})`);
                  addLog("→ Polling ogni 30s per 5 min in attesa nuovi dati su GitHub raw...");
                  let attempts = 0;
                  const oldDate = snapshot?.generatedAt;
                  const interval = setInterval(async () => {
                    attempts++;
                    setPollingCount(attempts);
                    setProgress(Math.min(95, 10 + (attempts / 10) * 90));
                    addLog(`→ Polling ${attempts}/10 controllo snapshot aggiornato...`);
                    try {
                      const newSnap = await fetchLatestSnapshot();
                      if (newSnap.generatedAt !== oldDate) {
                        addLog(`✓ Nuovi dati disponibili! ${new Date(newSnap.generatedAt).toLocaleString('it-IT')}`);
                        addLog(`✓ Aggiornamento completato - ${newSnap.titoli.length} titoli`);
                        clearInterval(interval);
                        setIsUpdating(false);
                        setProgress(100);
                        setTimeout(() => setProgress(0), 1500);
                      }
                    } catch (e) {
                      addLog(`✗ Polling errore ${e.message}`);
                    }
                    if (attempts >= 10) {
                      clearInterval(interval);
                      setIsUpdating(false);
                      setProgress(0);
                      addLog("→ Polling terminato dopo 5 min. Controlla su GitHub Actions se workflow completato.");
                    }
                  }, 30000);
                  return;
                }
              }
              throw new Error("Worker non raggiungibile o errore");
            } catch (e) {
              addLog(`⚠ Worker non deployato o errore: ${e.message}`);
              addLog("→ Fallback: reload diretto da GitHub raw con cache bust (nessun proxy)");
            }

            // Fallback: solo reload da GitHub raw
            setProgress(50);
            const newSnap = await fetchLatestSnapshot();
            setProgress(100);
            addLog(`✓ Dati ricaricati da GitHub raw: ${new Date(newSnap.generatedAt).toLocaleString('it-IT')}`);
            if (!workerOk) {
              addLog("→ Per trigger automatico 1-click senza aprire GitHub, deploya Worker (vedi worker.js - 1 minuto)");
            }
          } catch (e) {
            addLog(`✗ Errore aggiornamento: ${e.message}`);
          } finally {
            if (!isUpdating || progress >= 100) {
              setTimeout(() => {
                setIsUpdating(false);
                setProgress(0);
                setPollingCount(0);
              }, 1200);
            }
          }
        }

        if (!snapshot) return <div className="p-8 text-sm">Caricamento dati da GitHub...</div>;

        return (
          <div className="max-w-[1700px] mx-auto px-4 py-5">
            <header className="flex flex-wrap justify-between items-center gap-3 mb-3">
              <div>
                <h1 className="text-[20px] font-bold tracking-tight">Screener Italia Pro — Finale No Proxy</h1>
                <div className="text-[11px] text-slate-500 mono mt-1">
                  Template Base v3.1 • URL statico: <code className="bg-white px-1.5 py-0.5 rounded border">{SNAPSHOT_URLS_STATIC[0]}</code> • {snapshot.generatedAt?.slice(0,10)} • {snapshot.titoli.length} titoli • NO proxy
                </div>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-[11px] bg-white border rounded-full px-3 py-1 mono">
                  Ultimo: {new Date(snapshot.generatedAt).toLocaleString('it-IT').slice(0,16)}
                </span>
                <button
                  onClick={aggiornaPrezzi}
                  disabled={isUpdating}
                  className="bg-slate-900 text-white rounded-full px-4 py-1.5 text-xs font-medium hover:bg-black disabled:opacity-60"
                >
                  {isUpdating ? `⏳ ${pollingCount ? `Polling ${pollingCount}/10` : "Avvio..."}`
                    : "🔄 Aggiorna Prezzi"}
                </button>
              </div>
            </header>

            {isUpdating && (
              <div className="h-1 bg-slate-200 rounded-full overflow-hidden mb-4">

      function drawPrice(canvas, data, ind, opts) {
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.clientWidth, h = canvas.clientHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.clearRect(0,0,w,h);
        if (!data.length) return;
        const highs = data.map(d=>d.high), lows = data.map(d=>d.low);
        let min = Math.min(...lows), max = Math.max(...highs);
        const pad = (max-min)*0.12; min-=pad; max+=pad;
        const xStep = w / data.length;
        const y = v => h - ((v-min)/(max-min))*h;
        if (opts.showBB) {
          ctx.fillStyle = "rgba(99,102,241,0.07)";
          ctx.beginPath(); let s=false;
          for (let i=0;i<data.length;i++) if (ind.bb.upper[i]!==null) { if(!s){ctx.moveTo(i*xStep, y(ind.bb.upper[i])); s=true;} else ctx.lineTo(i*xStep, y(ind.bb.upper[i])); }
          for (let i=data.length-1;i>=0;i--) if (ind.bb.lower[i]!==null) ctx.lineTo(i*xStep, y(ind.bb.lower[i]));
          ctx.closePath(); ctx.fill();
        }
        data.forEach((bar,i)=>{
          const x = i*xStep + xStep*0.15; const bw = xStep*0.7;
          const isUp = bar.close >= bar.open;
          ctx.fillStyle = isUp ? "#10b981" : "#ef4444"; ctx.strokeStyle = isUp ? "#10b981" : "#ef4444";
          ctx.beginPath(); ctx.moveTo(x+bw/2, y(bar.high)); ctx.lineTo(x+bw/2, y(bar.low)); ctx.stroke();
          const top = y(Math.max(bar.open, bar.close)); const bh = Math.max(1, Math.abs(y(bar.open)-y(bar.close)));
          ctx.fillRect(x, top, bw, bh);
          if (opts.showVol) {
            const volMax = Math.max(...data.map(d=>d.volume)); const vh = (bar.volume / volMax) * h * 0.18;
            ctx.globalAlpha = 0.25; ctx.fillRect(x, h - vh, bw, vh); ctx.globalAlpha = 1;
          }
        });
        function drawLine(arr,color,dash){ ctx.strokeStyle=color; ctx.lineWidth=1; ctx.setLineDash(dash||[]); ctx.beginPath(); let s=false; arr.forEach((v,i)=>{ if(v===null) return; const xx=i*xStep+xStep/2; if(!s){ctx.moveTo(xx,y(v)); s=true;} else ctx.lineTo(xx,y(v)); }); ctx.stroke(); ctx.setLineDash([]); }
        if (opts.showSMA20) drawLine(ind.sma20, "#0ea5e9");
        if (opts.showSMA50) drawLine(ind.sma50, "#f59e0b");
        if (opts.showSMA200) drawLine(ind.sma200, "#8b5cf6", [4,4]);
        if (opts.showBB) { drawLine(ind.bb.upper, "#6366f1", [4,4]); drawLine(ind.bb.lower, "#6366f1", [4,4]); }
        if (opts.hoverIdx!==null){ const x=opts.hoverIdx*xStep+xStep/2; ctx.strokeStyle="rgba(0,0,0,0.18)"; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); ctx.setLineDash([]); }
      }

      function drawRSI(canvas, rsi, hoverIdx){
        if(!canvas) return;
        const ctx=canvas.getContext("2d"); const dpr=window.devicePixelRatio||1;
        const w=canvas.clientWidth, h=canvas.clientHeight; canvas.width=w*dpr; canvas.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
        ctx.strokeStyle="#e2e8f0"; ctx.setLineDash([4,4]); [30,70].forEach(v=>{ const yy=h-(v/100)*h; ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(w,yy); ctx.stroke(); }); ctx.setLineDash([]);
        const xStep=w/rsi.length; ctx.strokeStyle="#6366f1"; ctx.lineWidth=1.2; ctx.beginPath(); let s=false; rsi.forEach((v,i)=>{ if(v===null) return; const xx=i*xStep+xStep/2; const yy=h-(v/100)*h; if(!s){ctx.moveTo(xx,yy); s=true;} else ctx.lineTo(xx,yy); }); ctx.stroke();
        if(hoverIdx!==null){ const x=hoverIdx*xStep+xStep/2; ctx.strokeStyle="rgba(0,0,0,0.18)"; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); ctx.setLineDash([]); }
      }

      function drawMACD(canvas, macd, hoverIdx){
        if(!canvas) return;
        const ctx=canvas.getContext("2d"); const dpr=window.devicePixelRatio||1;
        const w=canvas.clientWidth, h=canvas.clientHeight; canvas.width=w*dpr; canvas.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
        const all=[...macd.macdLine.filter(v=>v!==null),...macd.signalLine.filter(v=>v!==null),...macd.histogram.filter(v=>v!==null)];
        if(!all.length) return; let min=Math.min(...all), max=Math.max(...all); const pad=(max-min)*0.15||1; min-=pad; max+=pad;
        const y=v=>h-((v-min)/(max-min))*h; const xStep=w/macd.macdLine.length; const zeroY=y(0);
        ctx.strokeStyle="#e2e8f0"; ctx.beginPath(); ctx.moveTo(0,zeroY); ctx.lineTo(w,zeroY); ctx.stroke();
        macd.histogram.forEach((v,i)=>{ if(v===null) return; const x=i*xStep+xStep*0.2; const bw=xStep*0.6; const top=y(Math.max(0,v)); const bh=Math.abs(y(v)-zeroY); ctx.fillStyle=v>=0?"#10b981":"#ef4444"; ctx.fillRect(x,top,bw,bh); });
        function line(arr,color){ ctx.strokeStyle=color; ctx.lineWidth=1; ctx.beginPath(); let s=false; arr.forEach((v,i)=>{ if(v===null) return; const xx=i*xStep+xStep/2; if(!s){ctx.moveTo(xx,y(v)); s=true;} else ctx.lineTo(xx,y(v)); }); ctx.stroke(); }
        line(macd.macdLine,"#0ea5e9"); line(macd.signalLine,"#f59e0b");
        if(hoverIdx!==null){ const x=hoverIdx*xStep+xStep/2; ctx.strokeStyle="rgba(0,0,0,0.18)"; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); ctx.setLineDash([]); }
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
