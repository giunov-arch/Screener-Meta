</div>

<script>
const SNAPSHOT_URLS = [
  "./data/snapshot.json",
  "./dati/snapshot.json",
  "data/snapshot.json",
  "dati/snapshot.json",
  "https://giunov-arch.github.io/Screener-Meta/data/snapshot.json",
  "https://giunov-arch.github.io/Screener-Meta/dati/snapshot.json",
  "https://raw.githubusercontent.com/giunov-arch/Screener-Meta/main/data/snapshot.json",
  "https://raw.githubusercontent.com/giunov-arch/Screener-Meta/main/dati/snapshot.json"
];

let snapshot = null;
let selected = null;
let titoliFiltrati = [];

window.onerror=function(m,src,line){ 
  const box=document.getElementById("logBox"); 
  if(box){ const d=document.createElement("div"); d.textContent="❌ JS ERROR: "+m+" @"+line; box.appendChild(d);} 
};

function log(msg){
  const box = document.getElementById('logBox');
  const div = document.createElement('div');
  div.textContent = new Date().toLocaleTimeString() + " " + msg;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  document.getElementById('log').textContent = msg;
}

function calcScoreF(f){
  let s=50;
  if(f.pe && f.pe>0){ if(f.pe<12) s+=12; else if(f.pe<18) s+=6; else if(f.pe>25) s-=10; }
  if(f.pb && f.pb>0){ if(f.pb<1.2) s+=8; else if(f.pb>3) s-=6; }
  if(f.roe && f.roe>15) s+=15; else if(f.roe && f.roe<5) s-=10;
  if(f.divYield && f.divYield>4) s+=8;
  if(f.debtEquity && f.debtEquity<0.5) s+=6; else if(f.debtEquity && f.debtEquity>1.2) s-=8;
  if(f.cet1 && f.cet1>14) s+=5;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function calcSMA(values, period){
  const res=[]; let sum=0;
  for(let i=0;i<values.length;i++){ sum+=values[i]; if(i>=period) sum-=values[i-period]; res.push(i>=period-1?sum/period:null); }
  return res;
}
function calcScoreT(history){
  if(!history || history.length<50) return 50;
  const closes=history.map(h=>h.close);
  const sma50=calcSMA(closes,50);
  const sma200=calcSMA(closes,200);
  const last=closes.length-1;
  let s=50;
  if(sma50[last] && sma200[last] && closes[last]>sma50[last] && sma50[last]>sma200[last]) s+=15;
  if(closes[last] && sma50[last] && Math.abs(closes[last]-sma50[last])/sma50[last]<0.02) s+=5;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function normalizeConsenso(con, prezzo, scoreTot){
  const fallbackRating = scoreTot>=70?"Buy":scoreTot>=50?"Hold":"Sell";
  const fallback = {
    rating: fallbackRating,
    targetPrice: +(prezzo*1.18).toFixed(2),
    upside: 18,
    buy: fallbackRating==="Buy"?10:3,
    hold:5,
    sell: fallbackRating==="Sell"?4:1,
    numAnalysts:8,
    tp: +(prezzo*1.18).toFixed(2),
    b: fallbackRating==="Buy"?10:3,
    h:5,
    s: fallbackRating==="Sell"?4:1,
    n:8
  };
  if(!con) return fallback;
  
  // Formato nuovo da Yahoo: {tp, lo, hi, n, n_target, b, h, s, strongBuy, buy, hold, sell, strongSell, rating, rec_mean, upside}
  const b = con.b ?? con.buy ?? 0;
  const h = con.h ?? con.hold ?? 0;
  const s = con.s ?? con.sell ?? 0;
  const n = con.n ?? (b+h+s) ?? 8;
  
  return {
    rating: con.rating || fallback.rating,
    targetPrice: con.tp || con.targetPrice || fallback.targetPrice,
    tp: con.tp || con.targetPrice || fallback.tp,
    lo: con.lo || 0,
    hi: con.hi || 0,
    buy: b,
    hold: h,
    sell: s,
    b: b,
    h: h,
    s: s,
    strongBuy: con.strongBuy || 0,
    strongSell: con.strongSell || 0,
    numAnalysts: n,
    n: n,
    n_target: con.n_target || n,
    rec_mean: con.rec_mean || null,
    upside: con.upside ?? (con.tp ? Math.round((con.tp/prezzo-1)*100) : 0)
  };
}

function parseSnapshot(j){
  let titoliRaw = j.titoli || j || [];
  const titoli = titoliRaw.map(t=>{
    let history = [];
    if(t.barre && t.barre.length){
      history = t.barre.map(b=>({
        date: b.d || b.date,
        open: b.o ?? b.open,
        high: b.h ?? b.high,
        low: b.l ?? b.low,
        close: b.c ?? b.close,
        volume: b.v ?? b.volume || 0
      }));
    } else if(t.history){
      history = t.history;
    }
    const f = t.f || {};
    const prezzo = history.length ? history[history.length-1].close : (t.prezzo || 0);
    const scoreF = t.ScoreF ?? t.scoreF ?? calcScoreF(f);
    const scoreT = t.ScoreT ?? t.scoreT ?? calcScoreT(history);
    const scoreTot = t.ScoreTot ?? t.scoreTot ?? Math.round((scoreF+scoreT)/2);
    const consenso = normalizeConsenso(t.con || t.consenso, prezzo, scoreTot);
    return {
      ticker: t.ticker || t.Ticker,
      nome: t.nome || t.Nome || t.ticker,
      settore: t.settore || t.Settore || "Altro",
      prezzo,
      pe: f.pe || 0,
      pb: f.pb || 0,
      roe: f.roe || 0,
      divYield: f.divYield || 0,
      debtEquity: f.debtEquity || 0,
      cet1: f.cet1 || 0,
      marketCap: f.mcap || f.marketCap || 0,
      scoreF, scoreT, scoreTot,
      consenso,
      history,
      f
    };
  });
  return { generatedAt: j.generato_il || j.generatedAt || new Date().toISOString(), titoli };
}

async function fetchSnapshot(){
  log("→ Avvio fetch snapshot collector.py...");
  for(let url of SNAPSHOT_URLS){
    try{
      log("→ Tento " + url);
      const bust = url + (url.includes("?")?"&":"?") + "v=" + Date.now();
      const r = await fetch(bust, {cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const text = await r.text();
      if(text.trim().startsWith("<") || text.includes("<!DOCTYPE")) throw new Error("Ricevuto HTML invece di JSON (404)");
      const j = JSON.parse(text);
      const snap = parseSnapshot(j);
      if(!snap.titoli.length) throw new Error("vuoto (0 titoli)");
      snapshot = snap;
      document.getElementById('lastUpdate').textContent = new Date(snap.generatedAt).toLocaleString('it-IT');
      document.getElementById('countInfo').textContent = snap.titoli.length + " titoli";
      document.getElementById('statusBadge').textContent = "Aggiornato";
      document.getElementById('statusBadge').className = "text-[11px] bg-emerald-50 text-emerald-700 border rounded-full px-3 py-1";
      log("✓ Trovato: " + new Date(snap.generatedAt).toLocaleString() + " (" + snap.titoli.length + " titoli) da " + url);
      render();
      return snap;
    }catch(e){
      log("✗ " + url + " → " + e.message);
    }
  }
  log("⚠ Nessuno snapshot trovato");
  throw new Error("Nessuno snapshot disponibile");
}

function render(){
  const testo = document.getElementById('filtroTesto').value.toLowerCase();
  const settore = document.getElementById('filtroSettore').value;
  titoliFiltrati = snapshot.titoli.filter(t=>{
    if(testo && !(t.ticker+" "+t.nome).toLowerCase().includes(testo)) return false;
    if(settore!=="Tutti" && t.settore!==settore) return false;
    return true;
  });
  document.getElementById('filtratiInfo').textContent = titoliFiltrati.length + " filtrati";
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = titoliFiltrati.map(t=>{
    const isSel = selected && selected.ticker===t.ticker;
    const upside = t.consenso.upside || 0;
    const upsideClass = upside>0 ? "text-emerald-600" : upside<0 ? "text-red-600" : "";
    return `<tr data-ticker="${t.ticker}" class="border-b hover:bg-slate-50 cursor-pointer ${isSel?'bg-slate-900 text-white':''}">
      <td class="px-3 py-1.5 font-semibold mono">${t.ticker}</td>
      <td class="px-3 py-1.5 truncate max-w-[160px]">${t.nome}</td>
      <td class="px-3 py-1.5">${t.settore}</td>
      <td class="px-3 py-1.5 mono">${t.prezzo.toFixed(2)}</td>
      <td class="px-3 py-1.5 mono">${(t.consenso.tp||0).toFixed(2)}</td>
      <td class="px-3 py-1.5 mono ${upsideClass}">${upside>0?'+':''}${upside}%</td>
      <td class="px-3 py-1.5 font-bold mono">${t.scoreTot}</td>
    </tr>`;
  }).join('');
  tbody.querySelectorAll('tr').forEach(tr=>{
    tr.addEventListener('click',()=>{
      const ticker = tr.getAttribute('data-ticker');
      selected = snapshot.titoli.find(x=>x.ticker===ticker);
      render();
      renderDettaglio();
    });
  });
  if(!selected && titoliFiltrati.length) { selected = titoliFiltrati[0]; renderDettaglio(); }
  const sel = document.getElementById('filtroSettore');
  if(sel.options.length<=1){
    const settori = ["Tutti", ...Array.from(new Set(snapshot.titoli.map(t=>t.settore)))];
    sel.innerHTML = settori.map(s=>`<option>${s}</option>`).join('');
  }
}

function renderDettaglio(){
  const box = document.getElementById('dettaglio');
  if(!selected){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const c = selected.consenso;
  const isBuy = c.rating==="Buy";
  const isSell = c.rating==="Sell";
  const totalRec = c.b + c.h + c.s;
  
  // Breakdown esatto come Yahoo Finance website
  const strongBuy = c.strongBuy || 0;
  const buyOnly = c.buy || 0;
  const holdOnly = c.hold || c.h || 0;
  const sellOnly = c.sell || 0;
  const strongSell = c.strongSell || 0;
  
  box.innerHTML = `
    <div class="grid grid-cols-12 gap-3">
      <div class="col-span-12 lg:col-span-8 bg-white border rounded-xl p-4">
        <h3 class="text-xs font-semibold mb-3">${selected.ticker} — ${selected.nome} • Fondamentali Yahoo Reali</h3>
        <div class="grid grid-cols-3 md:grid-cols-4 gap-2 text-[11px]">
          ${[
            ["Prezzo", selected.prezzo.toFixed(2)],
            ["PE", selected.pe],
            ["PB", selected.pb],
            ["ROE %", selected.roe],
            ["Div %", selected.divYield],
            ["Debt/Eq", selected.debtEquity],
            ["CET1 %", selected.cet1],
            ["MktCap Mld", selected.marketCap],
            ["ScoreF", selected.scoreF],
            ["ScoreT", selected.scoreT],
            ["ScoreTot", selected.scoreTot],
          ].map(([k,v])=>`<div class="bg-slate-50 rounded-lg px-2.5 py-2"><div class="text-[10px] text-slate-500 uppercase">${k}</div><div class="font-semibold mono">${v ?? "—"}</div></div>`).join('')}
        </div>
        <div class="mt-4">
          <canvas id="chart" width="800" height="360" style="width:100%;height:360px;border:1px solid #e2e8f0;border-radius:8px"></canvas>
        </div>
      </div>
      <div class="col-span-12 lg:col-span-4 space-y-3">
        <div class="bg-white border rounded-xl p-3">
          <div class="flex justify-between items-center mb-2">
            <span class="text-[11px] font-semibold">Consenso Yahoo Finance — Uguale al sito</span>
            <span class="text-[9px] px-1.5 py-0.5 rounded-full bg-slate-100">${c.n} analisti (rec) • ${c.n_target||c.n} per TP</span>
          </div>
          <div class="text-[11px] space-y-1.5">
            <div class="flex justify-between items-center"><span>Rating Yahoo</span><b class="px-2 py-0.5 rounded-full text-[10px] ${isBuy?'bg-emerald-500 text-white':isSell?'bg-red-500 text-white':'bg-amber-400 text-slate-900'}">${c.rating||"Hold"} ${c.rec_mean ? '('+c.rec_mean+')' : ''}</b></div>
            <div class="flex justify-between"><span>Target Medio (TP)</span><span class="mono font-medium">${(c.tp||0).toFixed(2)} €</span></div>
            <div class="flex justify-between"><span>Low / High</span><span class="mono">${(c.lo||0).toFixed(2)} / ${(c.hi||0).toFixed(2)}</span></div>
            <div class="flex justify-between"><span>Upside</span><span class="${(c.upside||0)>=0?'text-emerald-600':'text-red-600'} font-medium">${c.upside||0}%</span></div>
            <div class="pt-2 mt-2 border-t">
              <div class="text-[10px] text-slate-500 uppercase mb-1">Ripartizione esatta Yahoo (0m)</div>
              <div class="grid grid-cols-5 gap-1 text-[10px] text-center">
                <div class="bg-emerald-50 rounded p-1"><div class="font-bold">${strongBuy}</div><div class="text-[9px]">Strong Buy</div></div>
                <div class="bg-emerald-100 rounded p-1"><div class="font-bold">${buyOnly}</div><div class="text-[9px]">Buy</div></div>
                <div class="bg-amber-50 rounded p-1"><div class="font-bold">${holdOnly}</div><div class="text-[9px]">Hold</div></div>
                <div class="bg-red-50 rounded p-1"><div class="font-bold">${sellOnly}</div><div class="text-[9px]">Sell</div></div>
                <div class="bg-red-100 rounded p-1"><div class="font-bold">${strongSell}</div><div class="text-[9px]">Strong Sell</div></div>
              </div>
              <div class="flex justify-between mt-2 text-[10px]"><span>Totale Buy: ${c.b}</span><span>Hold: ${c.h}</span><span>Sell: ${c.s}</span><span>Tot: ${totalRec}</span></div>
            </div>
          </div>
          <div class="text-[9px] text-slate-400 mt-2">Fonte: Yahoo Finance API v10 quoteSummary recommendationTrend period 0m + financialData — uguale a finance.yahoo.com/quote/${selected.ticker}/analysis</div>
        </div>
        <div class="bg-white border rounded-xl p-3">
          <div class="text-[11px] font-semibold mb-2">Score</div>
          ${[["ScoreF",selected.scoreF],["ScoreT",selected.scoreT],["ScoreTot",selected.scoreTot]].map(([k,v])=>`
            <div class="mb-2"><div class="flex justify-between text-[11px]"><span>${k}</span><span class="mono">${v}</span></div><div class="h-1.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-slate-900" style="width:${v}%"></div></div></div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
  setTimeout(()=>drawChart(),50);
}

function drawChart(){
  const canvas = document.getElementById('chart');
  if(!canvas || !selected) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const data = selected.history;
  if(!data.length) return;
  const highs = data.map(d=>d.high), lows = data.map(d=>d.low);
  let min = Math.min(...lows), max = Math.max(...highs);
  const pad=(max-min)*0.12; min-=pad; max+=pad;
  const xStep = w / data.length;
  const y = v=> h - ((v-min)/(max-min))*h;
  data.forEach((bar,i)=>{
    const x=i*xStep + xStep*0.15; const bw=xStep*0.7;
    const isUp=bar.close>=bar.open;
    ctx.fillStyle=isUp?"#10b981":"#ef4444"; ctx.strokeStyle=isUp?"#10b981":"#ef4444";
    ctx.beginPath(); ctx.moveTo(x+bw/2, y(bar.high)); ctx.lineTo(x+bw/2, y(bar.low)); ctx.stroke();
    const top=y(Math.max(bar.open,bar.close)); const bh=Math.max(1, Math.abs(y(bar.open)-y(bar.close)));
    ctx.fillRect(x,top,bw,bh);
  });
  const closes=data.map(d=>d.close);
  const sma50=calcSMA(closes,50);
  ctx.strokeStyle="#f59e0b"; ctx.lineWidth=1; ctx.beginPath(); let started=false;
  sma50.forEach((v,i)=>{ if(v===null) return; const xx=i*xStep+xStep/2; if(!started){ctx.moveTo(xx,y(v)); started=true;} else ctx.lineTo(xx,y(v)); }); ctx.stroke();
}

document.getElementById('filtroTesto').addEventListener('input', render);
document.getElementById('filtroSettore').addEventListener('change', render);
document.getElementById('btnReload').addEventListener('click', ()=>{
  const btn=document.getElementById('btnReload');
  btn.textContent='⏳ Aggiorno...';
  btn.disabled=true;
  fetchSnapshot().finally(()=>{ btn.textContent='🔄 Aggiorna'; btn.disabled=false; });
});

fetchSnapshot().catch(e=>{
  document.getElementById('statusBadge').textContent="Errore";
  document.getElementById('statusBadge').className="text-[11px] bg-red-50 text-red-700 border rounded-full px-3 py-1";
  log("✗ Errore finale: "+e.message);
});

<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="ht
