name: Fetch Dati Borsa Italiana

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * 1-5'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run collector (genera dati/snapshot.json + data/italian_stocks.json)
        run: |
          # usa collector.py che hai caricato - è quello che funziona
          python collector.py || python github-screener-italia/fetcher_v4_collector_based.py
          ls -lh dati/ || true
          ls -lh data/ || true
          cat dati/snapshot.json | head -20 || true
      - name: Commit dati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dati/ data/ universo.json -f || git add dati/ data/ -f
          git status
          git diff --staged --quiet || git commit -m "Aggiornamento dati: $(date -u +'%Y-%m-%d %H:%M UTC') - $(cat dati/snapshot.json | grep -o '"ticker"' | wc -l) titoli"
          git push